name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --require-hashes --no-deps -r tools/requirements-ci.txt
      - name: Validate public package
        run: python tools/validate_package.py
      - name: Test archive rejection controls
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Build and validate release archive
        run: |
          python tools/build_release_zip.py --output dist/premilume-0.1.1-ci.zip
          python tools/validate_package.py --archive dist/premilume-0.1.1-ci.zip
